[package]
name = "vimpdf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "A keyboard-driven, vim-style PDF viewer"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6.0.0"
eframe = "0.37.0"
mupdf = "0.8.0"
notify = "8"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

# egui's font loader (fontique) turns on yeslogic-fontconfig-sys's `dlopen`
# feature; mupdf's font-kit then has to load fontconfig the same way, or it
# doesn't compile (feature unification).
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
font-kit = { version = "0.14", default-features = false, features = ["source-fontconfig-dlopen"] }
