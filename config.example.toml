# Example pdfv config. Copy to ~/.config/pdfv/config.toml and edit.
# Every option is optional; these are the defaults unless noted.
# Full reference: docs/configuration.md

[ui]
font_family = "Menlo"
font_size = 14
statusbar = true
menubar = true        # File / Edit / View menus; gm opens them even when hidden
toolbar = false
start_maximised = true
recolor = false       # start in recolor (dark) mode; <C-r> toggles
auto_reload = true    # reload when the file changes (e.g. LaTeX)

[colors]
page_background = "#ffffff"
recolor_dark = "#1e1e1e"
recolor_light = "#d4d4d4"
search_highlight = "#f9e2af80"
selection = "#89b4fa60"
caret = "#f38ba8"
hint_background = "#fab387"

[scroll]
step = 60        # screen points per j/k
smooth = true

[zoom]
step = 1.1
default_fit = "width"   # "width" | "page" | "none"

[mouse]
zoom_modifier = "cmd"   # "cmd" | "ctrl" | "alt" | "shift"; pinch always zooms
drag = "select"         # "select" | "pan"
pan_modifier = "alt"
copy_on_select = false

[highlight]
# Highlight colours by letter: in visual mode, a<letter> highlights the
# selection (aa repeats the last colour). 'a' itself is reserved.
colors = { y = "#ffe066", g = "#8ce99a", b = "#74c0fc", p = "#f783ac", r = "#ff8787", o = "#ffc078" }
default = "y"         # colour of c (comment) and of the first aa
author = ""           # written into new annotations; empty = your login name

[keys.normal]
# Examples (not defaults):
# "x" = "scroll_down 3"
# "<C-F>" = "toggle_fullscreen"
# "q" = ""              # unbind
